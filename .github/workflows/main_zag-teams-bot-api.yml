name: Build and Deploy to Azure Web App

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'        # ⛔ cache ашиглахгүй (анхны билдүүдэд lock байхгүй байж болно)

      # Lock файл байхгүй бол CI дээр үүсгэнэ; байвал алгасна
      - name: Ensure package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json not found. Creating with 'npm install --package-lock-only'..."
            npm install --package-lock-only
          else
            echo "package-lock.json already exists."
          fi

      # CI дээр бүрэн суулгана (prod only)
      - name: Install dependencies (CI)
        run: npm ci --omit=dev

      # ZIP артефакт (⚠️ node_modules-ийг БҮҮ хас)
      - name: Create deployment artifact (zip with node_modules)
        run: |
          zip -r release.zip . -x ".git/*" ".github/*"

      - name: Deploy to Azure Web App (ZIP Deploy)
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'zag-shine-bot-api'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './release.zip'
``
