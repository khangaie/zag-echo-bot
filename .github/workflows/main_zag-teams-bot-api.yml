name: Build and Deploy to Azure Web App

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ⛔ cache: 'npm' АШИГЛАХГҮЙ (lock файлаа эхлээд CI дээр үүсгэнэ)
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 🔹 Lock файл байхгүй бол CI дээр үүсгэнэ; байвал алгасна
      - name: Ensure package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json not found. Creating with 'npm install --package-lock-only'..."
            npm install --package-lock-only
          else
            echo "package-lock.json already exists."
          fi

      # 🔹 Reproducible install
      - name: Install dependencies (CI)
        run: npm ci --omit=dev

      # (шаардлагатай бол test/lint алхмууд энд)

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'zag-shine-bot-api'                         # Azure Portal → Overview дээрх яг нэр
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}  # Portal → Get publish profile → энэ нэртэй secret
          package: '.'                                          # Oryx сервер талд build хийж node_modules бэлдэнэ
