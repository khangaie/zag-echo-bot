name: Build and Deploy to Azure Web App
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # CI талд зөвхөн шалгалт/билдэнд хэрэгтэй бол npm ci --omit=dev
      - name: Install dependencies (for tests or lint if any)
        run: npm ci --omit=dev

      # Кодыг шууд deploy хийж болно (ZIP үүсгэх албагүй)
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'zag-shine-bot-api'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '.'
