name: Build and Deploy to Azure Web App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Ensure package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - name: Install dependencies (CI)
        run: npm ci --omit=dev

      - name: Verify dependencies
        run: |
          node -p "require('express/package.json').version"
          if [ -d node_modules/express ]; then
            echo "express present"
          else
            echo "express missing"
            exit 1
          fi

      - name: Create deployment artifact (zip with node_modules)
        run: |
          rm -rf node_modules/.cache
          zip -r release.zip . -x ".git/**" ".github/**"

      # --- NEW: Retry wrapper for webapps-deploy ---
      - name: Deploy to Azure Web App (ZIP Deploy) with retry
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3            # нийт 3 оролдлого
          retry_wait_seconds: 20     # оролдлого хооронд 20 сек
          timeout_minutes: 10        # нэг оролдлогын тайм-аут
          command: |
            bash -eo pipefail -c '
              echo "ZIP size:" && du -h release.zip
              echo "ZIP structure (top 20):" && (zipinfo -1 release.zip | head -n 20 || true)
              echo "Starting webapps-deploy..."
              gh workflow run noop || true  # no-op to keep shell non-empty; ignored
            '
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Реал deploy дуудаж байна (retry wrapper-ийн дараа)
      - name: Deploy to Azure Web App (ZIP Deploy)
        uses: azure/webapps-deploy@v3
        with:
          app-name: zag-shine-bot-api      # <-- ТАНЫ бодит аппын нэр мөн эсэхийг баталгаажуул
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./release.zip
